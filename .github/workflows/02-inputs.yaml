name: Playing with inputs
on: 
 workflow_dispatch:
  inputs:
   username:
    description: 'A username passed from the caller workflow'
    default: 'john-doe'
    required: false
    type: string 
   logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug  
jobs: 
 learn-input: 
  runs-on: ubuntu-latest
  steps:
    - name: Display inputs 
      run : | 
            echo "User is ${{inputs.username}}" 
            echo "logging level for the above user is ${{inputs.logLevel}}"